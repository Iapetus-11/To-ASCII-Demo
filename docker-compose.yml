version: "3.7"
services:
  backend:
    build: backend
    env_file:
      - backend/.env
    ports:
      - 127.0.0.1:27725:8000
  frontend:
    build:
      context: frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    depends_on:
      - backend
    ports:
      - 27724:3000
