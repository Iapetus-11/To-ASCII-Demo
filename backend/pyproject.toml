[tool.poetry]
name = "to-ascii-demo"
version = "0.0.0"
description = "Backend for the To-ASCII demo site"
authors = ["Milo Weinberg <iapetus011@gmail.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
to-ascii = { version = "^6.2.0", extras = ["speedups"] }
fastapi = ">=0.125.0,<0.126"
pydantic = "^1.10.26"
python-dotenv = "^1.2.3"
uvicorn = { version = "^0.53.0", extras = ["standard"] }
python-multipart = "^0.0.32"
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.14.11,<0.15"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
